<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/9682b0efe9.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="wrapper">
        <form action="">
            <h1>ورود</h1>
            <div class="input-box">
                <input type="text" placeholder="نام کاربری" required>
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="رمز عبور" required>
                <i class="fa-solid fa-lock"></i>
            </div>
            <div class="remember-forgot">
                <label for=""><input type="checkbox">به خاطر سپردن نام کابری</label>
                <a href="#">نام کابری یا رمز عبور خود را فراموش کرده اید؟</a>
            </div>
            <button type="submit" class="btn">ورود</button>
            <div class="register-link">
                <p>حساب کاربری ندارید؟</p><a href="#">ثبت نام</a>
            </div>
        </form>
    </div>
</body>
</html>
