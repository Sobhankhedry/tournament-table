  .info-table {
    width: 100%; /* Ensure the table takes up full width */
    border-collapse: collapse; /* Remove space between table cells */
  }
  
  .info-table th,
  .info-table td {
    padding: 3px; /* Add padding to table cells */

  .info-table thead {
    position: sticky; /* Keep the header fixed during scroll */

  .info-table th {

  .container {

    align-items: center;
  
    
    background: #121212;
    background: linear-gradient(

      #121212 25%,
      #1a1a1a 25%,
      #1a1a1a 50%,
      #121212 50%,
      #121212 75%,
      #1a1a1a 75%,
      #1a1a1a
    );
    background-size: 40px 40px;
  
    
    animation: move 4s linear infinite;
  }
  
  @keyframes move {
    0% {

.group {

.input-search {
  font-family: "Montserrat", sans-serif;
  width: 100%;
  height: 45px;
  padding-right: 10px;
  padding-left: 2.5rem;
  box-shadow: 0 0 0 1.5px #2b2c37, 0 0 25px -17px #000;
  border: 0;
  border-radius: 12px;
  background-color: #16171d;
  outline: none;
  color: #bdbecb;

}

.input::placeholder {
  color: #bdbecb;
}

.input:hover {

}

.input:active {
  transform: scale(0.95);
}

.input:focus {
  box-shadow: 0 0 0 2.5px #2f303d;
}

.search-icon {
  position: absolute;
  left: 1rem;
  fill: #bdbecb;
  width: 1rem;
  height: 1rem;
  pointer-events: none;
  z-index: 1;
  text-align: right;
  direction: rtl;
}
 
.cssbuttons-io {
  --scale: 0.77; 
  position: relative;
  font-family: inherit;
  font-weight: 500;
  font-size: calc(18px * var(--scale));
  letter-spacing: 0.05em;
  border-radius: calc(0.8em * var(--scale));
  cursor: pointer;
  border: none;
  background: linear-gradient(to right, #9839eb, #4a00e0);
  color: ghostwhite;
  overflow: hidden;
}

.cssbuttons-io span {
  position: relative;
  z-index: 10;
  transition: color 0.4s;
  display: inline-flex;
  align-items: center;
  padding: calc(0.8em * var(--scale)) calc(1.2em * var(--scale)) calc(0.8em * var(--scale)) calc(1.05em * var(--scale));
}

.cssbuttons-io::before,
.cssbuttons-io::after {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.cssbuttons-io::before {
  content: "";
  background: #000;
  width: 120%;
  left: -10%;
  transform: skew(30deg);
  transition: transform 0.4s cubic-bezier(0.3, 1, 0.8, 1);
}

.cssbuttons-io:hover::before {
  transform: translate3d(100%, 0, 0);
}

.cssbuttons-io:active {
  transform: scale(0.95);
}
